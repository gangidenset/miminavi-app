name: Build APK

# main に変更が入るたびに APK を作り、Releases の「latest」に置く
on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # map/floor.drawio（draw.io の図面）からアプリ用の地図データを作る
      - name: Convert floor map
        run: python3 tools/drawio_to_map.py map/floor.drawio app/src/main/assets/map.js

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Keep APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: miminavi-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish to Releases (latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk miminavi.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest miminavi.apk \
            --target "$GITHUB_SHA" \
            --title "最新ビルド #${GITHUB_RUN_NUMBER}" \
            --notes "スマホのブラウザで miminavi.apk をタップしてダウンロード → インストールしてください。（コミット ${GITHUB_SHA::7}）"
